name: Build and deploy dictionary search (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - site/**
      - src/build_pages.py
      - tests/test_build_pages.py
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-dictionary-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'data-')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax and test dictionary indexing
        run: |
          node --check site/app.js
          python -m compileall -q src/build_pages.py tests
          python -m unittest discover -s tests -v
      - name: Download published bilingual packages and compact enrichments
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloads
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [[ "$tag" != data-* ]]; then
            echo "::error::Expected main data release, got: $tag"
            exit 1
          fi
          echo "$tag" > downloads/.release-tag
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'manifest.json' \
            --pattern 'koreader--*.zip' \
            --pattern 'freedict--*.zip' \
            --pattern 'wikdict--*.zip' \
            --pattern 'enrichment--*.json.gz' \
            --pattern 'enrichments-extra--*.zip' \
            --dir downloads
          test "$(find downloads -maxdepth 1 -name 'koreader--*.zip' | wc -l)" -ge 74
          test -s downloads/manifest.json
      - name: Build source-labelled, lazy-loaded dictionary search indexes
        shell: bash
        run: |
          set -euo pipefail
          python src/build_pages.py \
            --download-dir downloads \
            --manifest downloads/manifest.json \
            --site-dir site \
            --release-tag "$(cat downloads/.release-tag)"
          test -s site/data/catalog.json
          python -m json.tool site/data/catalog.json > /dev/null
          du -sh site
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'data-')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
