name: Publish all available dictionary directions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-all-pairs.yml
      - src/download_pages_inputs.py
      - src/build_pages.py
      - src/select_compact_pages.py
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-all-pairs
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'danilfg/dicts' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'data-'))
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate parser and client
        run: |
          python -m unittest discover -s tests -v
          node --check site/app.js
          node --test tests/test_entry_format.cjs
      - name: Reuse the published bilingual and optional semantic indexes
        run: python src/refresh_pages_data.py --site-dir site
      - name: Download all KOReader pairs and all compact enrichment pairs from our Releases
        run: python src/download_pages_inputs.py --dir downloads
      - name: Produce searchable language-pair catalog and all compact data
        shell: bash
        run: |
          set -euo pipefail
          build() {
            python src/build_pages.py \
              --download-dir downloads \
              --manifest downloads/manifest.json \
              --release-tag "$(cat downloads/.release-tag)" \
              --site-dir site
          }
          if ! build 2>&1 | tee /tmp/dicts-pages-build.log; then
            if ! grep -q 'Pages index exceeds GitHub Pages 1 GB limit' /tmp/dicts-pages-build.log; then
              echo "::error::Dictionary build failed for a reason other than Pages size limit"
              exit 1
            fi
            echo "::warning::Full original archive index exceeds 1 GB. Using published compact indexes wherever available."
            python src/select_compact_pages.py --downloads downloads --skipped excluded-pages-zips
            python - <<'PY_CLEAR'
          import pathlib, shutil
          root=pathlib.Path('site/data')
          for file in root.iterdir():
              if file.name=='lexical':continue
              if file.is_dir():shutil.rmtree(file)
              else:file.unlink()
          PY_CLEAR
            build
          fi
          python - <<'PY'
          import json, pathlib
          m=json.loads(pathlib.Path("downloads/manifest.json").read_text())
          indexed=json.loads(pathlib.Path("site/data/catalog.json").read_text())
          indexed_pairs={x["pair"] for x in indexed["pairs"]}
          published_pairs={x["pair"] for x in m["assets"]
            if x.get("source") in ("koreader","freedict","wikdict") and x.get("pair")}
          missing=sorted(published_pairs-indexed_pairs)
          if missing:raise AssertionError("Unsearchable published directions: "+repr(missing[:30]))
          print("ALL LANGUAGE DIRECTIONS VERIFIED:",len(indexed_pairs),flush=True)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'data-')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
