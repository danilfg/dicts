name: Update all dictionary sources
on:
  push:
    branches: [main]
    paths: [.github/update-request]
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update-dicts
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'danilfg/dicts' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.setup.outputs.tag }}
      previous: ${{ steps.setup.outputs.previous }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test all source parsers and release policies
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
          node --test tests/test_entry_format.cjs
      - id: setup
        shell: bash
        run: |
          set -euo pipefail
          previous="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$previous" == v* ]]
          tag="v$(date -u +'%Y.%m.%d').$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --latest=false --title "Dicts $tag" --notes "Verified source refresh and normalization in progress."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: all
      UNIFIED_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS_RELEASE_TAG: ${{ needs.prepare.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check and download KOReader archives
        id: ko
        continue-on-error: true
        run: python src/refresh_koreader.py --previous "$PREVIOUS_RELEASE_TAG" --out upstream
      - name: Discard incomplete KOReader download
        if: steps.ko.outcome == 'failure'
        run: rm -rf upstream && mkdir upstream
      - name: Build bilingual sources and legacy study indexes with per-dictionary fallback
        run: |
          set -euo pipefail
          python src/build.py --upstream upstream --out dist --mode all
          python src/package_release.py --dist dist
          rm -f dist/SHA256SUMS.txt
          gh release upload "$UNIFIED_RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"

  refresh:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        source: [kaikki, tatoeba, oewn, omw, conceptnet]
    env:
      GH_TOKEN: ${{ github.token }}
      UNIFIED_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS_RELEASE_TAG: ${{ needs.prepare.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh source or retain the last verified copy
        run: python src/stage_source.py --tag "$UNIFIED_RELEASE_TAG" --previous "$PREVIOUS_RELEASE_TAG" --source ${{ matrix.source }}

  detect-changes:
    needs: [prepare, build-and-release, refresh]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS: ${{ needs.prepare.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: detect
        run: python src/release_plan.py --tag "$TAG" --previous "$PREVIOUS"

  normalize:
    needs: [prepare, detect-changes]
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        group: [bilingual, pages, oewn, omw, conceptnet, kaikki, tatoeba, pages-lexical]
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS: ${{ needs.prepare.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build or reuse verified normalized JSON shards
        run: python src/normalize_sources.py --tag "$TAG" --previous "$PREVIOUS" --group ${{ matrix.group }}

  publish:
    needs: [prepare, detect-changes, normalize]
    if: needs.detect-changes.outputs.changed == 'true' && needs.normalize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python src/unified_release.py finalize --tag "$TAG"

  pages:
    needs: [prepare, publish]
    uses: ./.github/workflows/pages-all-pairs.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: read
      pages: write
      id-token: write

  cleanup-incomplete:
    needs: [prepare, detect-changes, normalize, publish]
    if: always() && needs.prepare.result == 'success' && needs.publish.result != 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Delete only this unpublished draft
        run: |
          if [[ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]]; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes
          fi
