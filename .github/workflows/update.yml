name: Update all dictionary sources
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update.yml
      - src/unified_release.py
      - src/release_changes.py
      - src/build.py
      - src/mirror_raw.py
      - src/sync_lexical.py
      - configs/sources.json
      - tests/test_release_changes.py
  workflow_dispatch:
    inputs:
      mode:
        description: "all = refresh upstream; consolidate = migrate existing verified legacy snapshot"
        type: choice
        required: true
        options: [all, consolidate]
        default: all
  schedule:
    - cron: '17 4 1 * *'
permissions:
  contents: write
concurrency:
  group: update-dicts
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'danilfg/dicts'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.setup.outputs.tag }}
      mode: ${{ steps.setup.outputs.mode }}
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode || 'all' }}
    steps:
      - id: setup
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [[ "$GITHUB_EVENT_NAME" == push && "$latest" != v* ]]; then MODE=consolidate; fi
          if [[ "$MODE" == consolidate && "$latest" == v* ]]; then
            echo "::error::Migration already completed; use all"; exit 1
          fi
          tag="v$(date -u +'%Y.%m.%d').$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --latest=false --title "Dicts $tag" --notes "Draft until all eight source inventories pass."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
  migrate:
    needs: prepare
    if: needs.prepare.outputs.mode == 'consolidate'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {source: main, partition: 0, partitions: 4}
          - {source: main, partition: 1, partitions: 4}
          - {source: main, partition: 2, partitions: 4}
          - {source: main, partition: 3, partitions: 4}
          - {source: kaikki, partition: 0, partitions: 1}
          - {source: tatoeba, partition: 0, partitions: 1}
          - {source: oewn, partition: 0, partitions: 1}
          - {source: omw, partition: 0, partitions: 1}
          - {source: conceptnet, partition: 0, partitions: 1}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python src/unified_release.py migrate --tag "$TAG" --source ${{ matrix.source }} --partition ${{ matrix.partition }} --partitions ${{ matrix.partitions }}
  build-and-release:
    needs: prepare
    if: needs.prepare.outputs.mode == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: all
      UNIFIED_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source code and licensing fixtures
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Download source archives from owned KOReader mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream
          remote="DanielGregorini/koreader-dicts"
          tag=""
          if tag=$(gh release view --repo "$remote" --json tagName --jq .tagName 2>/dev/null) &&
             gh release download "$tag" --repo "$remote" --pattern '*.zip' --dir upstream; then
            echo "Source: original author release $remote $tag"
          else
            echo "::warning::Original release unavailable; using independently mirrored fallback"
            rm -f upstream/*.zip
            remote="danilfg/koreader-dicts"
            tag="v1.3.0"
            gh release download "$tag" --repo "$remote" --pattern '*.zip' --dir upstream
            gh release download "$tag" --repo "$remote" --pattern SHA256SUMS --dir upstream
            ( cd upstream && sha256sum -c SHA256SUMS )
          fi
          REMOTE="$remote" TAG="$tag" python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          repo=os.environ['REMOTE'];tag=os.environ['TAG']
          release=json.loads(subprocess.check_output(
              ['gh','api',f'repos/{repo}/releases/tags/{tag}']))
          zipassets=[x for x in release['assets'] if x['name'].endswith('.zip')]
          if len(zipassets)<74:raise SystemExit('Too few source dictionaries')
          for asset in zipassets:
              path=Path('upstream')/asset['name']
              if not path.is_file():raise SystemExit(f'Missing archive {asset["name"]}')
              digest=asset.get('digest')
              if digest and digest.startswith('sha256:'):
                  got=hashlib.sha256(path.read_bytes()).hexdigest()
                  if got!=digest.split(':',1)[1]:
                      raise SystemExit(f'Upstream SHA-256 mismatch: {asset["name"]}')
          (Path('upstream')/'SOURCE_INFO.json').write_text(
              json.dumps({'repository':repo,'tag':tag,'expected':len(zipassets)}))
          print(f'Verified {len(zipassets)} original archive files from {repo}@{tag}')
          PY
      - name: Build dictionaries, enrichments and legal manifests
        shell: bash
        run: |
          set -euo pipefail
          python src/build.py --upstream upstream --out dist --mode "$MODE"
          python -m json.tool dist/manifest.json >/dev/null
          test "$(find dist -maxdepth 1 -type f -name 'koreader--*.zip' | wc -l)" -ge 74
          test -s dist/THIRD-PARTY-NOTICES.md
          python src/package_release.py --dist dist
          test -s dist/BUNDLE-PARTS.json
          test -s dist/SHA256SUMS.txt
      - name: Stage main dictionaries in shared draft
        run: |
          rm -f dist/SHA256SUMS.txt
          gh release upload "$UNIFIED_RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"

  raw-text-corpora:
    needs: prepare
    if: needs.prepare.outputs.mode == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        source: [kaikki, tatoeba]
    env:
      GH_TOKEN: ${{ github.token }}
      UNIFIED_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate full source discovery
        run: |
          python -m unittest discover -s tests -v
      - name: Stage all available upstream text archives, preserving licenses
        run: |
          python src/mirror_raw.py --source ${{ matrix.source }}

  lexical-resources:
    needs: prepare
    if: needs.prepare.outputs.mode == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        source: [oewn, omw, conceptnet]
    env:
      GH_TOKEN: ${{ github.token }}
      UNIFIED_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate licenses and converters before publication
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -v
      - name: Stage lexical sources in shared draft
        run: python src/sync_lexical.py --source ${{ matrix.source }}


  publish:
    needs: [prepare, migrate, build-and-release, raw-text-corpora, lexical-resources]
    if: always() && needs.prepare.result == 'success' && ((needs.prepare.outputs.mode == 'consolidate' && needs.migrate.result == 'success') || (needs.prepare.outputs.mode == 'all' && needs.build-and-release.result == 'success' && needs.raw-text-corpora.result == 'success' && needs.lexical-resources.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python src/unified_release.py finalize --tag "$TAG"
  cleanup-incomplete:
    needs: [prepare, publish]
    if: always() && needs.prepare.result == 'success' && needs.publish.result != 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Remove only this failed run's draft
        run: |
          if [[ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]]; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes
          fi
