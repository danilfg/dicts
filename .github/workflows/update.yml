name: Update all dictionary sources
on:
  push:
    branches: [main]
    paths: [.github/update-request, .github/catalog-request]
  workflow_dispatch:
    inputs:
      catalog_only:
        description: Republish catalog aliases for the latest published release (no dictionaries rebuilt)
        type: boolean
        default: false
  schedule:
    - cron: '17 4 1 * *'
permissions:
  contents: write
  packages: write
  pages: write
  id-token: write
concurrency:
  group: update-dicts
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'danilfg/dicts' && github.ref == 'refs/heads/main' && !((github.event_name == 'workflow_dispatch' && inputs.catalog_only) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'catalog-only:')))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.setup.outputs.tag }}
      previous: ${{ steps.setup.outputs.previous }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/oci
        with:
          token: ${{ github.token }}
          actor: ${{ github.actor }}
      - name: Test all source parsers and release policies
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
          node --test tests/test_entry_format.cjs
      - name: Check available GitHub REST API budget
        timeout-minutes: 70
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 3900 ))
          while true; do
            read -r remaining reset <<< "$(gh api rate_limit --jq '.resources.core | [.remaining,.reset] | @tsv')"
            [[ "$remaining" =~ ^[0-9]+$ && "$reset" =~ ^[0-9]+$ ]]
            echo "GitHub REST API: remaining=$remaining, reset=$(date -u -d "@$reset" +%FT%TZ)"
            if (( remaining >= 700 )); then break; fi
            now=$(date +%s)
            if (( now >= deadline )); then
              echo "::error::Insufficient REST API quota after bounded wait"
              exit 1
            fi
            delay=$(( reset - now + 10 ))
            if (( delay < 15 )); then delay=15; fi
            if (( now + delay > deadline )); then delay=$(( deadline - now )); fi
            echo "Waiting for the existing API quota window to reset ($delay seconds)."
            sleep "$delay"
          done
      - name: Check anonymous access (initialize package if needed)
        run: python src/storage.py probe
      - id: setup
        shell: bash
        run: |
          set -euo pipefail
          previous="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$previous" == v* ]]
          tag="v$(date -u +'%Y.%m.%d').$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --latest=false --title "Dicts $tag" --notes "Verified source refresh and normalization in progress."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: all
      UNIFIED_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS_RELEASE_TAG: ${{ needs.prepare.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/oci
        with:
          token: ${{ github.token }}
          actor: ${{ github.actor }}
      - name: Check and download KOReader archives
        id: ko
        continue-on-error: true
        run: python src/refresh_koreader.py --previous "$PREVIOUS_RELEASE_TAG" --out upstream
      - name: Discard incomplete KOReader download
        if: steps.ko.outcome == 'failure'
        run: rm -rf upstream && mkdir upstream
      - name: Build bilingual sources and legacy study indexes with per-dictionary fallback
        run: |
          set -euo pipefail
          python src/build.py --upstream upstream --out dist --mode all
          python src/package_release.py --dist dist
          rm -f dist/SHA256SUMS.txt
          python src/storage.py upload --tag "$UNIFIED_RELEASE_TAG" dist/*

  refresh:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        source: [kaikki, tatoeba, oewn, omw, conceptnet]
    env:
      GH_TOKEN: ${{ github.token }}
      UNIFIED_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS_RELEASE_TAG: ${{ needs.prepare.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/oci
        with:
          token: ${{ github.token }}
          actor: ${{ github.actor }}
      - name: Refresh source or retain the last verified copy
        run: python src/stage_source.py --tag "$UNIFIED_RELEASE_TAG" --previous "$PREVIOUS_RELEASE_TAG" --source ${{ matrix.source }}

  detect-changes:
    needs: [prepare, build-and-release, refresh]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS: ${{ needs.prepare.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/oci
        with:
          token: ${{ github.token }}
          actor: ${{ github.actor }}
      - id: detect
        run: python src/release_plan.py --tag "$TAG" --previous "$PREVIOUS"

  normalize:
    needs: [prepare, detect-changes]
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        group: [bilingual, pages, oewn, omw, conceptnet, kaikki, tatoeba, pages-lexical]
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS: ${{ needs.prepare.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/oci
        with:
          token: ${{ github.token }}
          actor: ${{ github.actor }}
      - name: Build or reuse verified normalized JSON shards
        run: python src/normalize_sources.py --tag "$TAG" --previous "$PREVIOUS" --group ${{ matrix.group }}

  publish:
    needs: [prepare, detect-changes, normalize]
    if: needs.detect-changes.outputs.changed == 'true' && needs.normalize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/oci
        with:
          token: ${{ github.token }}
          actor: ${{ github.actor }}
      - name: Publish source licensing metadata
        run: python src/storage.py upload --tag "$TAG" legal/SOURCES.json legal/NOTICE.md LICENSE
      - run: python src/unified_release.py finalize --tag "$TAG"

  catalog:
    needs: [prepare, publish]
    if: ${{ always() && !cancelled() && github.repository == 'danilfg/dicts' && github.ref == 'refs/heads/main' && (needs.publish.result == 'success' || ((github.event_name == 'workflow_dispatch' && inputs.catalog_only) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'catalog-only:')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/oci
        with:
          token: ${{ github.token }}
          actor: ${{ github.actor }}
      - name: Publish and verify versioned catalog and latest OCI alias
        run: |
          if [[ -n "$TAG" ]]; then
            python src/publish_catalog.py --tag "$TAG"
          else
            python src/publish_catalog.py
          fi

  pages:
    needs: [prepare, publish]
    uses: ./.github/workflows/pages-all-pairs.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write

  cleanup-incomplete:
    needs: [prepare, detect-changes, normalize, publish]
    if: always() && needs.prepare.result == 'success' && needs.publish.result != 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Delete only this unpublished draft
        run: |
          if [[ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]]; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes
          fi
