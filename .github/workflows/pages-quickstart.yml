name: Publish Dicts Pages interface

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-quickstart.yml
      - site/**
      - src/refresh_pages_data.py
      - tests/test_entry_format.cjs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-dictionary-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'danilfg/dicts'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify JavaScript, formatting and build tests
        run: |
          set -euo pipefail
          node --check site/app.js
          node --check site/entry-format.js
          node --test tests/test_entry_format.cjs
          python -m unittest discover -s tests -v
      - name: Reuse all existing published search shards without GitHub API calls
        run: |
          python src/refresh_pages_data.py --site-dir site
          test -s site/data/catalog.json
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
