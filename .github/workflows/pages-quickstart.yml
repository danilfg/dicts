name: Publish first dictionary Pages (quick start)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-quickstart.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-quickstart
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'danilfg/dicts'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dictionary parser and browser application
        run: |
          set -euo pipefail
          node --check site/app.js
          python -m unittest discover -s tests -v
      - name: Download 6 verified language directions for first live searchable site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$tag" == data-* ]]
          echo "$tag" > downloads/.release-tag
          args=(--pattern manifest.json)
          for pair in en-ru ru-en en-es es-en en-de de-en; do
            for source in koreader freedict wikdict; do
              args+=(--pattern "$source--$pair.zip")
            done
            args+=(--pattern "enrichment--$pair.json.gz")
          done
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            "${args[@]}" --dir downloads
          test "$(find downloads -name '*--*.zip' | wc -l)" -ge 18
          test -s downloads/manifest.json
      - name: Generate real searchable dictionary shards for first launch
        run: |
          python src/build_pages.py \
            --download-dir downloads --manifest downloads/manifest.json \
            --site-dir site --release-tag "$(cat downloads/.release-tag)"
          python - <<'PY'
          import json,pathlib
          c=json.loads(pathlib.Path('site/data/catalog.json').read_text())
          p={x['pair'] for x in c['pairs']}
          assert {'en-ru','ru-en','en-es','es-en','en-de','de-en'}<=p, p
          print('First live Pages has',len(p),'verified language pairs')
          PY
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
