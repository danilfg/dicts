name: Publish Dicts Pages interface

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-quickstart.yml
      - site/**
      - src/deploy_normalized_pages.py
      - src/build_source_directory.py
      - tests/test_source_directory.py
      - tests/test_site_ui.cjs
      - tests/test_entry_format.cjs
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: deploy-dictionary-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'danilfg/dicts'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/oci
      - name: Verify JavaScript, formatting and build tests
        run: |
          set -euo pipefail
          node --check site/app.js
          node --check site/entry-format.js
          node --test tests/test_entry_format.cjs tests/test_site_ui.cjs
          python -m unittest discover -s tests -v
      - name: Extract verified Pages packs and version metadata from the current release
        run: |
          set -euo pipefail
          tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          python src/deploy_normalized_pages.py --tag "$tag" --site-dir site
          test -s site/data/sources.json
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
