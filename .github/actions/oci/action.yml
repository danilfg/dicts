name: Set up dictionary OCI storage
description: Install ORAS and authenticate only writers
inputs:
  token:
    description: Optional write token
    required: false
    default: ''
  actor:
    description: Optional GitHub actor
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@v2
      with:
        version: 1.3.0
    - if: inputs.token != ''
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ inputs.token }}
        REGISTRY_ACTOR: ${{ inputs.actor }}
      run: printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$REGISTRY_ACTOR" --password-stdin
